name: Build experimental extension
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: litvgold-builds
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'
      - name: Checkout official CloudStream Gradle plugin
        uses: actions/checkout@v5
        with:
          repository: recloudstream/gradle
          ref: 69fdb8fc4be2815cbdf5ecec7f407727001cc7c7
          path: .ci/cloudstream-gradle
          persist-credentials: false
      - name: Build and publish official Gradle plugin locally
        shell: bash
        run: |
          printf '\nversion = "litvgold-local"\n' >> .ci/cloudstream-gradle/build.gradle.kts
          gradle -p .ci/cloudstream-gradle publishToMavenLocal --stacktrace --no-configuration-cache
          test -f "$HOME/.m2/repository/com/lagradost/cloudstream3/gradle/litvgold-local/gradle-litvgold-local.pom"
      - name: Compile CloudStream extension
        shell: bash
        run: |
          set -o pipefail
          gradle :LiTVGold:make makePluginsJson --stacktrace --no-configuration-cache 2>&1 | tee build-output.log
      - uses: actions/upload-artifact@v4
        with:
          name: LiTVGold-cs3
          path: 'LiTVGold/**/*.cs3'
          if-no-files-found: error
      - name: Prepare repository files
        shell: bash
        run: |
          mkdir -p repo-output
          cp LiTVGold/build/LiTVGold.cs3 repo-output/
          cp build/plugins.json repo-output/
          python3 - <<'PY'
          import json, pathlib, os
          out = pathlib.Path("repo-output")
          base = "https://raw.githubusercontent.com/" + os.environ["GITHUB_REPOSITORY"] + "/builds/"
          plugins = json.loads((out / "plugins.json").read_text())
          assert len(plugins) == 1
          assert plugins[0]["url"] == base + "LiTVGold.cs3", plugins
          (out / "repo.json").write_text(json.dumps({"name":"LiTVGold 測試來源庫","description":"實驗版，尚未驗證手機播放","manifestVersion":1,"pluginLists":[base+"plugins.json"]}, ensure_ascii=False, indent=2))
          PY
      - name: Save repository files
        uses: actions/upload-artifact@v4
        with:
          name: LiTVGold-repository
          path: repo-output/
      - name: Publish files to builds branch (repository visibility unchanged)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          target="$RUNNER_TEMP/litvgold-builds"
          git worktree add --detach "$target" HEAD
          if git ls-remote --exit-code --heads origin builds >/dev/null; then
            git fetch origin builds
            git -C "$target" switch -C builds FETCH_HEAD
          else
            git -C "$target" switch --orphan builds
          fi
          cp repo-output/* "$target/"
          git -C "$target" add LiTVGold.cs3 repo.json plugins.json
          if ! git -C "$target" diff --cached --quiet; then
            git -C "$target" commit -m "Update LiTVGold test repository"
            git -C "$target" push origin HEAD:refs/heads/builds
          fi
      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-log
          path: build-output.log
          if-no-files-found: ignore
